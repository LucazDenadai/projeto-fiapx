# CD (ADR-0012): a cada push na main, CI, imagens sha-<commit> no GHCR, deploy
# efêmero no runner com elas, smoke test e Trivy. Só então a tag main avança.
# Uma tag git vX.Y.Z não gera imagem nova: revalida a sha-<commit> que a main
# publicou e a promove para X.Y.Z.
name: CD

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  REGISTRO: ghcr.io/lucazdenadai

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publicar:
    name: publica ${{ matrix.servico }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [api, worker, notifier]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Sem o cache do CI: o que é publicado só sai deste build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.servico }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRO }}/fiapx-${{ matrix.servico }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # A imagem publicada é outro build que a do CI: varre de novo, a que vai valer.
  varrer:
    name: Trivy na ${{ matrix.servico }} publicada
    needs: publicar
    if: >-
      !cancelled() && (needs.publicar.result == 'success' ||
      (startsWith(github.ref, 'refs/tags/v') && needs.publicar.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        servico: [api, worker, notifier]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/fiapx-${{ matrix.servico }}:sha-${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  implantar:
    name: deploy efêmero e smoke test
    needs: publicar
    # Na tag git, ci e publicar são pulados de propósito; falha neles, não.
    if: >-
      !cancelled() && (needs.publicar.result == 'success' ||
      (startsWith(github.ref, 'refs/tags/v') && needs.publicar.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: sha-${{ github.sha }}
      # Sem o compose.override.yml: só as imagens publicadas, nenhum build.
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: .env descartável
        run: |
          sed -e "s/troque-esta-senha/$(openssl rand -hex 16)/" \
              -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env.example > .env
          ! grep -E '^[A-Z_]+=troque' .env
      - name: Baixar as imagens
        run: docker compose pull --quiet
      - name: Subir a stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Smoke test
        run: scripts/smoke.sh
      - name: A fila sobrevive à recriação do RabbitMQ
        run: scripts/recriacao.sh
      - name: Estado e logs da stack
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

  promover:
    name: avança a tag da imagem
    needs: [implantar, varrer]
    if: ${{ !cancelled() && needs.implantar.result == 'success' && needs.varrer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promover-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      # Execução antiga, atrasada ou refeita, não volta a tag main para trás.
      - name: Confere se a main ainda está neste commit
        id: ponta
        run: |
          atual=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$atual" != "$GITHUB_SHA" ]; then
            echo "::notice::a main já está em $atual; a tag main da imagem não muda"
            echo "promove=nao" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promove para main ou X.Y.Z
        if: steps.ponta.outputs.promove != 'nao'
        run: |
          tag=${GITHUB_REF_NAME#v} # v1.0.0 vira 1.0.0; main continua main
          for servico in api worker notifier; do
            imagem=$REGISTRO/fiapx-$servico
            docker buildx imagetools create --tag "$imagem:$tag" "$imagem:sha-$GITHUB_SHA"
          done
