# CI (ADR-0012): em todo PR e, chamado pelo cd.yml, em todo push na main.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: gofmt, vet e golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          naoformatados=$(gofmt -l cmd internal migrations)
          if [ -n "$naoformatados" ]; then
            echo "::error::Arquivos fora do gofmt:"
            echo "$naoformatados"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  testes:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Os testes do Worker usam o ffmpeg real (ADR-0016).
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: go test -race (com integração via testcontainers)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Cobertura no resumo
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "### Cobertura"
            echo ""
            echo "Total: **${total}**"
            echo ""
            echo "<details><summary>Por função</summary>"
            echo ""
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  vulnerabilidades:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  imagens:
    name: imagem ${{ matrix.servico }} + Trivy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [api, worker, notifier]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.servico }}.Dockerfile
          tags: fiapx-${{ matrix.servico }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
      # Falha só com CRITICAL que já tenha correção (ADR-0012).
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fiapx-${{ matrix.servico }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
