version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    misspell:
      locale: US
      ignore-rules:
        - servico
  exclusions:
    paths:
      - legacy

formatters:
  enable:
    - gofmt
