# Stack do FIAP X, com as imagens publicadas no GHCR (ADR-0012). Suba com:
#   cp .env.example .env && docker compose pull && docker compose up -d --no-build
# Para gerar as imagens do código, use --build (compose.override.yml).
#
# A porta pública da API, o Grafana e o Mailpit (estes só em localhost) saem do
# Compose; a porta interna (9090: /metrics, /healthz, /readyz), o Prometheus e
# as outras dependências ficam na rede interna (ADR-0001, ADR-0010).

x-postgres-url: &postgres-url "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  rabbitmq:
    image: rabbitmq:4.2-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina no .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina no .env}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 20s

  # Efêmero (ADR-0009): sem RDB nem AOF, com teto de memória e volatile-ttl.
  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  # Execução única: aplica as migrations antes de API e Worker (ADR-0016).
  migrate:
    image: ghcr.io/lucazdenadai/fiapx-api:${TAG:-main}
    command: ["migrate"]
    restart: "no"
    environment:
      DATABASE_URL: *postgres-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/lucazdenadai/fiapx-api:${TAG:-main}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${API_CPUS:-0.5}
          memory: ${API_MEMORIA:-256m}
    memswap_limit: ${API_MEMORIA:-256m}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: *postgres-url
      RABBITMQ_URL: *rabbitmq-url
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      # Limite de tentativas (ADR-0009). Vazio: vale o padrão do código
      LIMITE_LOGIN_EMAIL_MAX: ${LIMITE_LOGIN_EMAIL_MAX:-}
      LIMITE_LOGIN_EMAIL_JANELA: ${LIMITE_LOGIN_EMAIL_JANELA:-}
      LIMITE_LOGIN_IP_MAX: ${LIMITE_LOGIN_IP_MAX:-}
      LIMITE_LOGIN_IP_JANELA: ${LIMITE_LOGIN_IP_JANELA:-}
      LIMITE_CADASTRO_IP_MAX: ${LIMITE_CADASTRO_IP_MAX:-}
      LIMITE_CADASTRO_IP_JANELA: ${LIMITE_CADASTRO_IP_JANELA:-}
      LIMITE_REDIS_TIMEOUT: ${LIMITE_REDIS_TIMEOUT:-}
      # Envio de Vídeo (ADR-0011). Vazio: 500 MB e 10 min
      ENVIO_TAMANHO_MAX_MB: ${ENVIO_TAMANHO_MAX_MB:-}
      ENVIO_TIMEOUT: ${ENVIO_TIMEOUT:-}
      COTA_VIDEOS: ${COTA_VIDEOS:-}
      # Polling da outbox (ADR-0003). Vazio: 1 s
      OUTBOX_INTERVALO: ${OUTBOX_INTERVALO:-}
      # Mesmo valor no Worker (ADR-0004). Vazio: 5
      DELIVERY_LIMIT: ${DELIVERY_LIMIT:-}
    volumes:
      - dados:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/api", "healthcheck"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Escala (ADR-0011): 2 réplicas por padrão, um ffmpeg em cada. Para mais,
  # docker compose up -d --scale worker=N. O Vídeo que estoura a memória derruba
  # só o ffmpeg ou a réplica dele, que volta; a mensagem é reentregue (ADR-0004).
  worker:
    image: ghcr.io/lucazdenadai/fiapx-worker:${TAG:-main}
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: ${WORKER_CPUS:-1}
          memory: ${WORKER_MEMORIA:-1g}
    memswap_limit: ${WORKER_MEMORIA:-1g}
    environment:
      DATABASE_URL: *postgres-url
      RABBITMQ_URL: *rabbitmq-url
      DATA_DIR: /data
      OUTBOX_INTERVALO: ${OUTBOX_INTERVALO:-}
      DELIVERY_LIMIT: ${DELIVERY_LIMIT:-}
      # Retry e DLQ (ADR-0004). Vazio: 1 s e 1 min
      RETRY_BACKOFF_INICIAL: ${RETRY_BACKOFF_INICIAL:-}
      RETRY_ORCAMENTO: ${RETRY_ORCAMENTO:-}
      # Processamento (ADR-0011, ADR-0015). Vazio: 1, 10 min, 10 min e 7 dias
      WORKER_PREFETCH: ${WORKER_PREFETCH:-}
      FFMPEG_TIMEOUT: ${FFMPEG_TIMEOUT:-}
      VIDEO_DURACAO_MAXIMA: ${VIDEO_DURACAO_MAXIMA:-}
      ZIP_RETENCAO: ${ZIP_RETENCAO:-}
      # Limpador (ADR-0015). Vazio: 1 h, 1 h e 7 dias
      LIMPADOR_INTERVALO: ${LIMPADOR_INTERVALO:-}
      LIMPADOR_IDADE_ORFAO: ${LIMPADOR_IDADE_ORFAO:-}
      # Só para conferir que a idade acima é maior que ele.
      ENVIO_TIMEOUT: ${ENVIO_TIMEOUT:-}
      OUTBOX_RETENCAO: ${OUTBOX_RETENCAO:-}
    volumes:
      - dados:/data
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/worker", "healthcheck"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifier:
    image: ghcr.io/lucazdenadai/fiapx-notifier:${TAG:-main}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${NOTIFIER_CPUS:-0.25}
          memory: ${NOTIFIER_MEMORIA:-128m}
    memswap_limit: ${NOTIFIER_MEMORIA:-128m}
    environment:
      RABBITMQ_URL: *rabbitmq-url
      # Notificação por e-mail (ADR-0008). No Compose, o Mailpit.
      SMTP_ENDERECO: ${SMTP_ENDERECO:-mailpit:1025}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-nao-responda@fiapx.local}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-}
      # Retry e DLQ (ADR-0004): mesmos valores da API e do Worker.
      DELIVERY_LIMIT: ${DELIVERY_LIMIT:-}
      RETRY_BACKOFF_INICIAL: ${RETRY_BACKOFF_INICIAL:-}
      RETRY_ORCAMENTO: ${RETRY_ORCAMENTO:-}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/notifier", "healthcheck"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # SMTP de desenvolvimento (ADR-0008): recebe os e-mails e os mostra em
  # http://localhost:8025. O SMTP (1025) fica só na rede interna.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]

  # Métricas (ADR-0010): só na rede interna; quem mostra é o Grafana.
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]

  # Datasource e dashboard vêm dos arquivos versionados: nada é configurado
  # pela interface. http://localhost:3000, com a credencial do .env.
  grafana:
    image: grafana/grafana:13.3.2
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?defina no .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fiapx.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  postgres:
  rabbitmq:
  dados:
  prometheus:
